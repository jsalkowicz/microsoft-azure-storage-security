<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Azure Blob CORS Test</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; }
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
    button { padding: 10px 16px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 14px; white-space: pre-wrap; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Azure Blob CORS Test</h1>
  <p>Paste the short-lived Blob SAS URL below. The URL is used only in your browser and is not saved by this page.</p>
  <input id="sasUrl" type="password" placeholder="Paste Blob SAS URL here">
  <button id="testBtn">Test Blob Read</button>
  <pre id="result">Waiting for test...</pre>

  <script>
    document.getElementById("testBtn").addEventListener("click", async () => {
      const url = document.getElementById("sasUrl").value.trim();
      const result = document.getElementById("result");

      if (!url) {
        result.textContent = "Paste the SAS URL first.";
        return;
      }

      result.textContent = "Testing...";

      try {
        const response = await fetch(url, { method: "GET" });
        const text = await response.text();

        if (response.ok) {
          result.textContent =
            "SUCCESS\n\nHTTP " + response.status + "\n\nBlob contents:\n" + text;
        } else {
          result.textContent =
            "REQUEST REACHED AZURE BUT FAILED\n\nHTTP " + response.status + "\n\n" + text;
        }
      } catch (error) {
        result.textContent =
          "BROWSER REQUEST FAILED\n\n" +
          error +
          "\n\nIf the SAS URL is valid, this can indicate a CORS/origin problem.";
      }
    });
  </script>
</body>
</html>
